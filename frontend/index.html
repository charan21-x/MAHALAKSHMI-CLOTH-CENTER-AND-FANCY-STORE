<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Mahalakshmi | Shop the collection</title>
  <meta name="description" content="Explore sarees, clothing and fancy items at Mahalakshmi Cloth Center & Fancy Store.">
  <link rel="stylesheet" href="storefront.css?v=1">
  <link rel="stylesheet" href="opening-logo.css?v=3">
  <script src="store-config.js?v=2" defer></script>
  <script src="opening-logo.js?v=3" defer></script>
  <script src="storefront.js?v=1" defer></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to products</a>
  <header id="storeHeader" class="store-header"></header>
  <nav id="categoryNav" class="category-nav" aria-label="Product categories"></nav>
  <main id="main" class="store-main">
    <section class="collection-banner" aria-labelledby="collectionTitle">
      <div><p class="eyebrow">THE MAHALAKSHMI COLLECTION</p><h1 id="collectionTitle">A little tradition.<br>A lot of you.</h1></div>
      <p>Sarees, everyday favourites<br>and the finishing touches.</p>
      <span class="banner-mark" aria-hidden="true">M</span>
    </section>
    <section aria-labelledby="resultsTitle" class="catalogue">
      <div class="catalogue-toolbar">
        <div><p class="eyebrow">FIND YOUR NEXT FAVOURITE</p><h2 id="resultsTitle">All products <span id="productCount" class="product-count"></span></h2></div>
        <label class="sort-label">Sort by <select id="sortProducts"><option value="featured">Featured</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="name">Name: A–Z</option></select></label>
      </div>
      <div id="loadStatus" class="load-status" role="status" aria-live="polite"></div>
      <div id="productGrid" class="product-grid" aria-label="Products" aria-busy="true"></div>
    </section>
  </main>
  <footer class="store-footer"><span data-store-name>MAHALAKSHMI</span><span>Cloth Center & Fancy Store</span><a href="orders.html">Track your orders →</a></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="empty-state">Please enable JavaScript to view the collection.</p></noscript>
</body>
</html>
