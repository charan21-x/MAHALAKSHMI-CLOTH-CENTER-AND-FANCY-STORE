<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Product details | Mahalakshmi</title>
  <link rel="stylesheet" href="storefront.css?v=1">
  <script src="store-config.js?v=1" defer></script>
  <script src="storefront.js?v=1" defer></script>
  <!-- MAHALAKSHMI LOTUS START -->
  <link rel="stylesheet" href="lotus-branding.css?v=lotus1">
  <script src="lotus-branding.js?v=lotus1" defer></script>
  <!-- MAHALAKSHMI LOTUS END -->
</head>
<body data-page="product">
  <a class="skip-link" href="#main">Skip to product details</a>
  <header id="storeHeader" class="store-header"></header>
  <main id="main" class="store-main detail-main">
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span>Product details</span></nav>
    <div id="loadStatus" class="load-status" role="status" aria-live="polite"></div>
    <div id="productDetail" aria-busy="true"><div class="detail-loading">Loading product details…</div></div>
    <section id="similarSection" class="similar-section" aria-labelledby="similarTitle" hidden><div class="section-heading"><h2 id="similarTitle">You may also like</h2><a href="index.html">View all →</a></div><div id="similarProducts" class="product-grid"></div></section>
  </main>
  <footer class="store-footer"><span data-store-name>MAHALAKSHMI</span><span>Cloth Center & Fancy Store</span><a href="orders.html">My Orders →</a></footer>
  <dialog id="imageDialog" class="image-dialog" aria-label="Product photo"><button id="closeImage" class="dialog-close" type="button" aria-label="Close enlarged photo">×</button><img id="enlargedImage" alt=""></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="empty-state">Please enable JavaScript to view this product.</p></noscript>
</body>
</html>
