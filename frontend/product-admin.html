<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage products | Mahalakshmi Store</title><link rel="stylesheet" href="store-products.css"><script src="product-admin.js" defer></script></head><body>
<header class="store-header"><a class="store-brand" href="index.html">MAHALAKSHMI STORE</a><span>Product management</span></header><main class="store-shell">
<section id="loginPanel" class="store-panel"><h1>Admin login</h1><form id="loginForm" class="store-form"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="store-button" id="loginButton">Sign in</button></form></section>
<p id="message" class="store-message" role="status" aria-live="polite"></p>
<section id="dashboard" hidden><div class="store-row"><h1>Products</h1><button id="logout" class="store-button secondary">Log out</button></div>
<section class="store-panel"><div class="store-row"><h2 id="formTitle">Add product</h2><button id="cancelEdit" class="store-button secondary" hidden>Cancel edit</button></div>
<form id="productForm" class="store-form"><input id="productId" type="hidden">
<label>Name<input id="name" required maxlength="150"></label><label>Category<input id="category" maxlength="80" placeholder="Sarees, jewellery, accessories"></label>
<label>Price (₹)<input id="price" type="number" min="0" max="10000000" step="0.01" required></label><label>Stock quantity<input id="stock" type="number" min="0" max="1000000" step="1" required></label>
<label class="wide">Product photos<input id="imageFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Upload up to 10 photos. You can select many together OR choose them one-by-one. The first photo is shown on the home page; opening the product shows all photos.</small></label>
<div id="imagePreview" class="store-thumbs wide" aria-label="Image previews"></div>
<label class="wide">Full description<textarea id="description" rows="6" maxlength="10000"></textarea></label>
<label class="wide">Product details &amp; care<textarea id="details" rows="4" maxlength="6000" placeholder="Material, size, colour, dimensions and care instructions"></textarea></label>
<label>Minimum delivery days<input id="deliveryMinDays" type="number" min="0" max="365" step="1" placeholder="Leave blank if unknown"></label><label>Maximum delivery days<input id="deliveryMaxDays" type="number" min="0" max="365" step="1" placeholder="Leave blank if unknown"></label>
<label>Return window (days)<input id="returnDays" type="number" min="0" max="365" step="1" placeholder="0 = no returns; blank = not specified"></label>
<label>Return conditions<textarea id="returnPolicy" rows="3" maxlength="2000" placeholder="Your actual return conditions"></textarea></label>
<label class="wide"><span><input id="isActive" type="checkbox" checked> Show this product in the store</span></label>
<button id="saveProduct" class="store-button wide">Add product</button></form></section>
<section class="store-panel"><div class="store-row"><h2>All products</h2><button id="refresh" class="store-button secondary">Refresh</button></div><label>Search products<input id="search" type="search" placeholder="Name or category"></label><div class="store-table-wrap"><table class="store-table"><thead><tr><th>Photo</th><th>Product</th><th>Price</th><th>Stock</th><th>Visibility</th><th>Actions</th></tr></thead><tbody id="productRows"></tbody></table></div></section></section></main></body></html>
